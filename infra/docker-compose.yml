services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: truvanai_postgres
    environment:
      POSTGRES_USER: truvanai
      POSTGRES_PASSWORD: truvanaipass
      POSTGRES_DB: truvanai_poc
    ports:
      - "5433:5432"
    volumes:
      - truvanai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truvanai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: truvanai_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  truvanai_postgres_data:
