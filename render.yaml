services:
  - type: web
    name: truvanai-poc
    runtime: python
    buildCommand: pip install -r requirements.txt && python scripts/init_db.py
    startCommand: uvicorn hitl.dashboard:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GMAIL_SENDER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GMAIL_RECIPIENT
        sync: false
      - key: HITL_PASSWORD
        value: truvanai2024
      - key: SIMULATE_VIOLATION
        value: true
